
<!-- COLISEO MANAGER 3.2 - PERMISOS DE CAJA -->
<script>
(function () {
  "use strict";

  const $32 = id => document.getElementById(id);
  const fmt32 = n => money(Number(n || 0));
  const esc32 = s => esc(String(s ?? ""));
  const permiso32 = () =>
    me && ["admin", "cashier"].includes(me.role);

  let sesion32 = null;

  async function consultar32(tabla, columnas, campo, valor) {
    const todos = [];

    for (let i = 0; i < 10000; i += 500) {
      let q = db.from(tabla)
        .select(columnas)
        .range(i, i + 499);

      if (campo) q = q.eq(campo, valor);

      const { data, error } = await q;
      if (error) throw error;

      todos.push(...(data || []));
      if ((data || []).length < 500) return todos;
    }

    throw Error("Demasiados registros para consultar.");
  }

  function importe32(id, permitirCero = false) {
    const texto = String($32(id)?.value ?? "").trim();

    if (!/^\d+(\.\d{1,2})?$/.test(texto)) {
      throw Error("Captura un importe válido.");
    }

    const valor = Number(texto);

    if (valor > 1000000 ||
        (!permitirCero && valor <= 0)) {
      throw Error("Importe fuera del rango permitido.");
    }

    return valor;
  }

  // Botón para el personal de Caja
  const pantallaCaja = $32("cashier");

  if (pantallaCaja && !$32("botonCajaDiaria32")) {
    const boton = document.createElement("button");
    boton.id = "botonCajaDiaria32";
    boton.className = "yellow";
    boton.textContent = "💵 Caja diaria";

    boton.onclick = () => abrirCajaDiaria32();

    const referencia =
      pantallaCaja.querySelector(".section");

    if (referencia) {
      pantallaCaja.insertBefore(boton, referencia);
    } else {
      pantallaCaja.appendChild(boton);
    }
  }

  const volver = $32("cashV31")?.querySelector(".back");

  if (volver) {
    volver.onclick = () => {
      if (me?.role === "cashier") caja();
      else goAdmin();
    };
  }

  window.abrirCajaDiaria32 = async function () {
    if (!permiso32()) {
      alert("No tienes permiso.");
      return;
    }

    show("cashV31");
    await refreshCashV31();
  };

  window.openCashV31 = window.abrirCajaDiaria32;

  window.refreshCashV31 = async function () {
    if (!permiso32()) return;

    const panel = $32("cashContentV31");
    panel.textContent = "Consultando caja…";

    try {
      const { data, error } = await db
        .from("cash_sessions_v31")
        .select("*")
        .order("opened_at", { ascending: false })
        .limit(50);

      if (error) throw error;

      const sesiones = data || [];
      const admin = me.role === "admin";

      sesion32 = sesiones.find(
        x => x.status === "open"
      ) || null;

      if (!sesion32) {
        panel.innerHTML = `
          <div class="card">
            <h3>Abrir caja</h3>
            <p>Captura el fondo inicial para dar cambio.</p>

            <label>Fondo inicial (MXN)</label>
            <input id="fondo32" type="number"
              min="0" step="0.01">

            <button class="yellow"
              onclick="abrirFondo32()">
              Abrir caja
            </button>
          </div>
        `;
      } else {
        const s = sesion32;

        const movimientos = await consultar32(
          "cash_movements_v31",
          "id,kind,amount,reason,business,created_at,created_by",
          "session_id",
          s.id
        );

        const entradas = movimientos
          .filter(x => x.kind === "entry")
          .reduce((a, x) => a + Number(x.amount), 0);

        const salidas = movimientos
          .filter(x => x.kind !== "entry")
          .reduce((a, x) => a + Number(x.amount), 0);

        let ventas = {
          efectivo: 0,
          tarjeta: 0,
          transferencia: 0,
          otro: 0,
          abiertas: 0
        };

        if (admin) {
          const ordenes = await consultar32(
            "orders",
            "id,total,status,payment_method",
            "business_date",
            s.business_date
          );

          for (const o of ordenes) {
            if (o.status === "open") {
              ventas.abiertas++;
              continue;
            }

            if (o.status !== "closed") continue;

            const metodo = String(
              o.payment_method || ""
            ).trim().toLowerCase();

            const clave = [
              "efectivo",
              "tarjeta",
              "transferencia"
            ].includes(metodo) ? metodo : "otro";

            ventas[clave] += Number(o.total || 0);
          }
        }

        const esperado =
          Number(s.opening_fund) +
          ventas.efectivo +
          entradas - salidas;

        window.expectedCashV31 = esperado;

        let html = `
          <div class="card">
            <h3>Caja abierta · ${esc32(s.business_date)}</h3>

            <div class="row">
              <span>Fondo inicial</span>
              <b>${fmt32(s.opening_fund)}</b>
            </div>

            <div class="row">
              <span>Entradas adicionales</span>
              <b>${fmt32(entradas)}</b>
            </div>

            <div class="row">
              <span>Gastos y retiros</span>
              <b>−${fmt32(salidas)}</b>
            </div>
        `;

        if (admin) {
          html += `
            <div class="divider"></div>

            <div class="row">
              <span>Ventas en efectivo</span>
              <b>${fmt32(ventas.efectivo)}</b>
            </div>

            <div class="row">
              <span>Tarjeta</span>
              <b>${fmt32(ventas.tarjeta)}</b>
            </div>

            <div class="row">
              <span>Transferencia</span>
              <b>${fmt32(ventas.transferencia)}</b>
            </div>

            <div class="row">
              <b>Efectivo esperado</b>
              <b>${fmt32(esperado)}</b>
            </div>
          `;

          if (ventas.abiertas) {
            html += `<div class="notice">
              Hay ${ventas.abiertas} cuentas abiertas.
              Deben cobrarse antes del cierre.
            </div>`;
          }

          if (ventas.otro) {
            html += `<div class="notice">
              Hay cobros con método no reconocido.
            </div>`;
          }
        } else {
          html += `
            <div class="notice">
              El conteo y cierre definitivo
              son exclusivos de administración.
            </div>
          `;
        }

        html += `
          </div>

          <div class="card">
            <h3>Registrar movimiento de efectivo</h3>

            <label>Tipo de movimiento</label>
            <select id="tipo32">
              <option value="expense">
                Gasto pagado de caja
              </option>
              <option value="withdrawal">
                Retiro de efectivo
              </option>
              <option value="entry">
                Entrada adicional (no venta)
              </option>
            </select>

            <label>Negocio (obligatorio)</label>
            <select id="negocio32">
              <option value="">Seleccionar negocio</option>
              <option value="Cuervos Pizza">
                Cuervo’s Pizza
              </option>
              <option value="EL CLúB">
                EL CLúB
              </option>
              <option value="General">
                Gastos generales de Coliseo
              </option>
            </select>

            <label>Importe (MXN)</label>
            <input id="cantidad32" type="number"
              min="0.01" step="0.01">

            <label>Motivo del pago (obligatorio)</label>
            <textarea id="motivo32" rows="3"
              placeholder="Ej. Compra de hielo para EL CLúB"
            ></textarea>

            <button class="yellow"
              onclick="guardarMovimiento32()">
              Guardar movimiento
            </button>

            <div class="divider"></div>
            <h3>Movimientos registrados</h3>
        `;

        if (!movimientos.length) {
          html += "<p>Sin movimientos registrados.</p>";
        }

        for (const m of movimientos) {
          const nombre = m.kind === "entry"
            ? "Entrada"
            : m.kind === "expense"
              ? "Gasto"
              : "Retiro";

          const fecha = new Date(
            m.created_at
          ).toLocaleString("es-MX", {
            timeZone: "America/Tijuana"
          });

          html += `
            <div style="padding:10px 0;
              border-bottom:1px solid #7775">

              <div class="row">
                <span>
                  ${nombre} · ${esc32(m.business)}
                </span>
                <b>
                  ${m.kind === "entry" ? "+" : "−"}
                  ${fmt32(m.amount)}
                </b>
              </div>

              <div class="muted">
                ${esc32(m.reason)}
              </div>

              <small>
                ${esc32(fecha)}
                · Usuario: ${esc32(m.created_by)}
              </small>
            </div>
          `;
        }

        html += "</div>";

        // Cierre visible exclusivamente al administrador
        if (admin) {
          html += `
            <div class="card">
              <h3>Cierre definitivo</h3>

              <p>Cuenta todo el efectivo,
              incluyendo el fondo inicial.</p>

              <label>Efectivo contado</label>
              <input id="countedV31" type="number"
                min="0" step="0.01"
                oninput="previewCashV31()">

              <label>Fondo para el siguiente día</label>
              <input id="nextFundV31" type="number"
                min="0" step="0.01"
                oninput="previewCashV31()">

              <div id="previewV31" class="notice">
                Captura los importes para
                calcular la diferencia.
              </div>

              <label>Observaciones</label>
              <textarea id="notesV31" rows="3">
              </textarea>

              <button class="yellow"
                onclick="closeCashV31()">
                Confirmar cierre definitivo
              </button>
            </div>
          `;
        }

        panel.innerHTML = html;
      }

      if (admin) {
        const cerradas = sesiones.filter(
          x => x.status === "closed"
        );

        let historial = `
          <div class="card">
            <h3>Historial de cierres</h3>
        `;

        for (const c of cerradas) {
          historial += `
            <div style="padding:10px 0;
              border-bottom:1px solid #7775">
              <b>${esc32(c.business_date)}</b>

              <div class="row">
                <span>Fondo inicial</span>
                <b>${fmt32(c.opening_fund)}</b>
              </div>

              <div class="row">
                <span>Efectivo esperado</span>
                <b>${fmt32(c.expected_cash)}</b>
              </div>

              <div class="row">
                <span>Efectivo contado</span>
                <b>${fmt32(c.counted_cash)}</b>
              </div>

              <div class="row">
                <span>Diferencia</span>
                <b>${fmt32(c.difference)}</b>
              </div>

              <div class="row">
                <span>Fondo reservado</span>
                <b>${fmt32(c.next_fund)}</b>
              </div>

              <div class="muted">
                ${esc32(c.notes)}
              </div>
            </div>
          `;
        }

        if (!cerradas.length) {
          historial += "<p>Sin cierres guardados.</p>";
        }

        panel.insertAdjacentHTML(
          "beforeend",
          historial + "</div>"
        );
      }

    } catch (e) {
      panel.innerHTML = `
        <div class="notice">
          ⚠️ ${esc32(e.message || String(e))}
        </div>
        <button class="yellow"
          onclick="refreshCashV31()">
          Reintentar
        </button>
      `;
    }
  };

  window.abrirFondo32 = async function () {
    if (!permiso32()) return;

    try {
      const fondo = importe32("fondo32", true);

      if (!confirm(
        "¿Abrir caja con fondo de " + fmt32(fondo) + "?"
      )) return;

      const { error } = await db.rpc("cash_open_v31", {
        p_fund: fondo
      });

      if (error) throw error;

      await refreshCashV31();

    } catch (e) {
      alert("No se abrió la caja: " + e.message);
    }
  };

  window.guardarMovimiento32 = async function () {
    if (!permiso32() || !sesion32) return;

    try {
      const cantidad = importe32("cantidad32");
      const tipo = $32("tipo32").value;
      const negocio = $32("negocio32").value;
      const motivo = $32("motivo32").value.trim();

      if (!negocio || !motivo) {
        throw Error(
          "Debes seleccionar el negocio " +
          "y escribir el motivo del pago."
        );
      }

      if (motivo.length > 500) {
        throw Error("El motivo es demasiado largo.");
      }

      if (!confirm(
        "¿Guardar movimiento de " +
        fmt32(cantidad) + "?\n" +
        "Negocio: " + negocio + "\n" +
        "Motivo: " + motivo
      )) return;

      const { error } = await db.rpc(
        "cash_move_v32",
        {
          p_session: sesion32.id,
          p_kind: tipo,
          p_amount: cantidad,
          p_reason: motivo,
          p_business: negocio
        }
      );

      if (error) throw error;

      alert("Movimiento guardado correctamente.");
      await refreshCashV31();

    } catch (e) {
      alert("No se guardó: " + e.message);
    }
  };

})();
</script>
